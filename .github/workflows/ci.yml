# CET6 回归门禁（放在 cet6-scripts 仓，因为 package.json 和全部测试脚本都在这个仓）
#
# 为什么布局这么绕：项目是三个独立 git 仓分治的——
#   cet6-scripts（测试）+ cet6（app 源码）+ cet4（孪生项目，双项目防漏修闸门要对照）。
# 测试脚本里 ROOT = scripts/..，且 check_divergence.js 用 ROOT 的目录名判断自己是 CET6 还是 CET4，
# 所以工作区根目录必须叫 CET6，不能叫仓库名 cet6-scripts。
# 三个仓都是 PUBLIC，跨仓 clone 不需要 token。
# CI 只覆盖 core 组里 11 个"纯本地"用例；另外 2 个跨仓用例用 --skip 显式排除，
# 并在结果 JSON 的 skipped 字段留痕，保留给本地全量回归执行。
name: CET6 core 回归

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # 当前仓放到 CET6/scripts；path 用 CET6/scripts 而非仓库名，保证 ROOT 目录名 = CET6
      - name: 取测试脚本（当前提交）
        uses: actions/checkout@v4
        with:
          path: CET6/scripts

      - name: 取应用源码，拼回本地布局
        run: |
          mkdir -p CET6/docs/metrics
          git clone --depth 1 https://github.com/gongyining0601/cet6.git CET6/app
          test -f CET6/app/core.js
          echo "布局就绪："
          ls CET6

      - name: 装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # core 组不需要浏览器；--ignore-scripts 避免下载 playwright 浏览器，省几分钟
      - name: 装依赖
        working-directory: CET6/scripts
        run: npm install --ignore-scripts --no-audit --no-fund

      # 跳过 2 个依赖「完整多仓布局」的用例（干净环境模拟已验证它们会因缺文件误红）：
      #   check_divergence.js 要对照 CET4 项目的 app + scripts 两套仓
      #   test_id_isolation.js 要读根仓 README.md（根仓没有远端）
      # 这两项保留在本地全量回归执行；结果 JSON 的 skipped 字段会如实记录。
      - name: 跑 core 组（假绿/缩水/崩溃六态闸门）
        working-directory: CET6/scripts
        run: node run_all.js --group=core --skip=check_divergence.js,test_id_isolation.js

      # 门禁结果无论红绿都留档，方便回溯是哪条用例、多少断言
      - name: 上传回归结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-all-core-result
          path: |
            CET6/docs/run-all-result.json
            CET6/docs/metrics/baseline.json

      # 部署一致性检查需要 curl 访问 GitHub Pages，单独作为可选步骤跑（不挡 PR）
      - name: 线上版本一致性（部署后）
        if: github.event_name == 'workflow_dispatch'
        working-directory: CET6/scripts
        run: node test_deploy_version.js
